            border-radius: 4px;
            transition: background-color 0.3s;
            font-weight: 500;
            margin-top: 20px;
        }
        
        .home-link:hover {

        }
        
        @media (max-width: 768px) {

                padding: 40px 20px;
            }
            
            h1 {

            }
